name: daily event ingest

on:
  schedule:
    - cron: "15 6 * * *" # daily 6:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-event-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build events.json
        run: python scripts/build_events.py

      - name: Commit updated events.json
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add events.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Daily events ingest"
          git push
